<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quran Animals: picture books by Liliia Noor that help young Muslim children learn about the animals of the Quran.">
<meta property="og:title" content="Quran Animals by Liliia Noor">
<meta property="og:image" content="https://liliianoor.com/img/bee.webp">
<title>Quran Animals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: sticky nav with language switch, honey-lit hero, shelf of covers that open into detail sheets, a quiz, parents, gallery, author, buy */
:root {
  --bg: #fbf8f1;
  --surface: #ffffff;
  --band: #f4ecda;
  --ink: #2b2347;
  --muted: #6b6482;
  --line: #e7dfcc;
  --gold: #b9780f;
  --gold-soft: #fbedc8;
  --on-gold: #ffffff;
  --good: #2f8a4c;
  --good-soft: #def3e3;
  --bad: #c0442f;
  --bad-soft: #fbe3de;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, sans-serif;
  --font-arabic: "Amiri", "Noto Naskh Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17142a; --surface: #221e3a; --band: #1e1a33; --ink: #f4efe2; --muted: #b3abc9;
    --line: #36305a; --gold: #f2bb4a; --gold-soft: #3a2f1a; --on-gold: #1b1630;
    --good: #6fd08d; --good-soft: #1d3a29; --bad: #f08a76; --bad-soft: #43231f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17142a; --surface: #221e3a; --band: #1e1a33; --ink: #f4efe2; --muted: #b3abc9;
  --line: #36305a; --gold: #f2bb4a; --gold-soft: #3a2f1a; --on-gold: #1b1630;
  --good: #6fd08d; --good-soft: #1d3a29; --bad: #f08a76; --bad-soft: #43231f; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.inner {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

/* Nav */
nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
nav .inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; text-decoration: none; line-height: 1; white-space: nowrap; }
.logo span { color: var(--gold); }
.nav-right { display: flex; align-items: center; gap: 22px; min-width: 0; }
.links { display: flex; gap: 20px; font-weight: 700; font-size: 15px; }
.links a { text-decoration: none; color: var(--muted); white-space: nowrap; }
.links a:hover { color: var(--ink); }
@media (max-width: 900px) { .links a:not(.keep) { display: none; } }
@media (max-width: 480px) { .links { display: none; } }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button {
  border: 0; background: transparent; cursor: pointer; font-weight: 800; font-size: 13px;
  padding: 5px 10px; border-radius: 999px; color: var(--muted);
}
.lang button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 800 16px var(--font-body); padding: 13px 24px; border-radius: 999px;
  text-decoration: none; cursor: pointer; border: 2px solid transparent;
}
.btn-gold { background: var(--gold); color: var(--on-gold); }
.btn-gold:hover { filter: brightness(1.06); }
.btn-ghost { border-color: var(--line); background: transparent; color: var(--ink); }
.btn-ghost:hover { border-color: var(--gold); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }

/* Hero */
.hero .inner { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; padding-block: 56px 64px; }
@media (max-width: 820px) { .hero .inner { grid-template-columns: 1fr; padding-block: 36px 48px; } }
.eyebrow { font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
h1 { font-family: var(--font-display); font-weight: 800; margin: 10px 0 16px; font-size: clamp(2.5rem, 6.4vw, 4.4rem); line-height: 1.02; text-wrap: balance; }
.lede { max-width: 54ch; margin: 0 0 26px; color: var(--muted); font-size: 1.12rem; }
.hero-art { position: relative; min-width: 0; }
.hero-art img { display: block; width: 100%; max-width: 520px; margin: 0 auto; border-radius: 28px; background: #fff; box-shadow: 0 30px 60px -30px rgba(120, 80, 10, .45); }
.badge { position: absolute; left: 0; bottom: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 14px; line-height: 1.3; }
.badge small { display: block; font-weight: 600; color: var(--muted); }

/* Sections */
section { padding-block: 64px; }
section.band { background: var(--band); }
h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; margin: 6px 0 12px; text-wrap: balance; }
.sec-intro { max-width: 60ch; color: var(--muted); margin: 0 0 32px; }

.names { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 32px; padding: 0; list-style: none; }
.names li { font-family: var(--font-arabic); font-size: 1.3rem; line-height: 1; padding: 9px 15px 11px; border-radius: 999px; background: var(--gold-soft); }
.names li span + span { font-family: var(--font-body); font-size: 13px; font-weight: 700; color: var(--muted); margin-inline-start: 6px; }

/* Shelf */
.shelf { display: grid; gap: 26px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr)); }
.book {
  display: grid; grid-template-rows: auto 1fr; overflow: hidden; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 0; cursor: pointer;
  transition: transform .25s ease, box-shadow .25s ease;
}
.book:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -22px var(--tint); }
.cover { background: #fff; aspect-ratio: 1; max-width: 100%; }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.info { display: grid; gap: 8px; align-content: start; padding: 18px 22px 22px; border-top: 6px solid var(--tint); }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.num { font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ar { font-family: var(--font-arabic); font-size: 1.55rem; line-height: 1; color: var(--tint); }
.book h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1.1; margin: 0; }
.lesson { margin: 0; font-weight: 800; color: var(--tint); }
.more { font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 4px; }

.bee { --tint: #c88a06; } .crow { --tint: #6b3fa0; } .ant { --tint: #a2551f; }
.elephant { --tint: #2f6db0; } .hoopoe { --tint: #d26a12; } .spider { --tint: #8a6a2c; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .bee { --tint: #f2c14a; }
  :root:not([data-theme="light"]) .crow { --tint: #b896ea; }
  :root:not([data-theme="light"]) .ant { --tint: #e39a63; }
  :root:not([data-theme="light"]) .elephant { --tint: #7fb2ec; }
  :root:not([data-theme="light"]) .hoopoe { --tint: #f5a35a; }
  :root:not([data-theme="light"]) .spider { --tint: #d9bb7b; }
}
:root[data-theme="dark"] .bee { --tint: #f2c14a; }
:root[data-theme="dark"] .crow { --tint: #b896ea; }
:root[data-theme="dark"] .ant { --tint: #e39a63; }
:root[data-theme="dark"] .elephant { --tint: #7fb2ec; }
:root[data-theme="dark"] .hoopoe { --tint: #f5a35a; }
:root[data-theme="dark"] .spider { --tint: #d9bb7b; }

/* Dialog */
dialog { width: min(880px, calc(100% - 32px)); max-height: calc(100% - 48px); padding: 0; border: 0; border-radius: 26px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(20, 16, 40, .55); }
.sheet { display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 720px) { .sheet { grid-template-columns: 1fr; } }
.sheet-body { display: grid; gap: 12px; align-content: start; padding: 28px; min-width: 0; border-top: 6px solid var(--tint); }
@media (min-width: 721px) { .sheet-body { border-top: 0; border-left: 6px solid var(--tint); } }
.sheet-body h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1.1; margin: 0; }
.sheet-body p { margin: 0; }
.sheet-body ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.ref { justify-self: start; font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.label { font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; cursor: pointer; }
.soon { font-size: 14px; color: var(--muted); }

/* Quiz */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: clamp(20px, 4vw, 40px); display: grid; gap: 22px; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dots span.on { background: var(--gold); }
.dots span.ok { background: var(--good); }
.dots span.no { background: var(--bad); }
.score { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.q-prompt { display: grid; gap: 6px; text-align: center; }
.q-prompt .big-ar { font-family: var(--font-arabic); font-size: clamp(3rem, 10vw, 4.5rem); line-height: 1.3; color: var(--gold); }
.q-prompt .big-lesson { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 4.5vw, 2.2rem); line-height: 1.15; color: var(--gold); }
.q-prompt .ask { font-weight: 800; font-size: 1.15rem; }
.options { display: grid; gap: 14px; grid-template-columns: repeat(4, 1fr); }
@media (max-width: 720px) { .options { grid-template-columns: repeat(2, 1fr); } }
.opt {
  display: grid; gap: 8px; padding: 10px 10px 14px; border-radius: 20px; cursor: pointer; text-align: center;
  background: var(--bg); border: 3px solid var(--line); font-weight: 800; font-size: 1.05rem;
  transition: transform .15s ease, border-color .15s ease;
}
.opt img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; background: #fff; }
.opt:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--gold); }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.feedback { min-height: 1.6em; text-align: center; font-weight: 800; font-size: 1.1rem; margin: 0; }
.feedback.ok { color: var(--good); }
.feedback.no { color: var(--bad); }
.quiz-foot { display: flex; justify-content: center; }
.result { text-align: center; display: grid; gap: 12px; justify-items: center; }
.result .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.result p { margin: 0; max-width: 46ch; }

/* Parents */
.values { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.value { background: var(--surface); border-radius: 20px; padding: 22px; border: 1px solid var(--line); }
.value h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin: 0 0 6px; }
.value p { margin: 0; color: var(--muted); }

/* Gallery */
.gallery { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.art { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.art img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #fff; }
.art figcaption { padding: 10px 14px 14px; font-weight: 700; font-size: 15px; }
.art figcaption small { display: block; color: var(--muted); font-weight: 600; }
.frames { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); margin-bottom: 24px; }
.frame {
  aspect-ratio: 4 / 3; border-radius: 20px; border: 3px dashed var(--line); display: grid; place-items: center;
  font-family: var(--font-arabic); font-size: 2.6rem; color: var(--line);
}
.invite { background: var(--gold-soft); border-radius: 22px; padding: 22px 26px; max-width: 70ch; }
.invite p { margin: 0; }
.invite strong { display: block; font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 4px; }

/* Author */
.author { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center; }
@media (max-width: 640px) { .author { grid-template-columns: 1fr; } }
.monogram { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); font-family: var(--font-display); font-weight: 800; font-size: 3rem; color: var(--gold); }
.author p { max-width: 62ch; margin: 0 0 12px; }

/* Buy */
.buy { background: var(--gold-soft); border-radius: 28px; padding: 40px clamp(20px, 5vw, 56px); display: grid; gap: 14px; justify-items: start; }
.buy h2 { margin: 0; }
.buy p { margin: 0; max-width: 58ch; }
.stores { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.store { padding: 10px 18px; border-radius: 999px; background: var(--surface); border: 1px dashed var(--line); font-weight: 800; font-size: 15px; color: var(--muted); }
a.store { border-style: solid; color: var(--ink); text-decoration: none; }
a.store:hover { border-color: var(--gold); }

/* Buy options inside a book sheet */
.buy-opts { display: grid; gap: 10px; margin-top: 6px; }
.buy-main { display: grid; gap: 4px; padding: 16px 18px; border-radius: 18px; background: var(--gold-soft); }
.buy-main strong { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.2; }
.buy-main span { font-size: 14px; color: var(--muted); }
.buy-main .btn { justify-self: start; margin-top: 8px; }
.buy-alt { font-size: 15px; color: var(--muted); margin: 0; }
.buy-alt a { color: var(--ink); font-weight: 800; }

/* Activity books */
.acts { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.act { display: grid; grid-template-rows: auto 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.act img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #fff; }
.act-body { display: grid; gap: 8px; align-content: start; padding: 18px 20px 20px; }
.act-body h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.15; margin: 0; }
.act-body p { margin: 0; color: var(--muted); font-size: 15px; }
.act-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 6px; }
.price { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.tag { justify-self: start; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
.act-soon { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.act-ghost { border: 3px dashed var(--line); border-radius: 22px; padding: 24px; display: grid; gap: 6px; align-content: start; }
.act-ghost strong { font-family: var(--font-display); font-size: 1.2rem; }
.act-ghost span { color: var(--muted); font-size: 15px; }

/* Ways to buy */
.ways { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); width: 100%; margin-top: 8px; }
.way { background: var(--surface); border-radius: 20px; padding: 20px; display: grid; gap: 6px; align-content: start; }
.way h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; margin: 0; }
.way p { margin: 0; color: var(--muted); font-size: 15px; }
.way.quiet { background: transparent; border: 1px solid var(--line); }

/* Shipping calculator */
.ship { width: 100%; margin-top: 18px; background: var(--surface); border-radius: 22px; padding: clamp(18px, 3vw, 28px); display: grid; gap: 18px; }
.ship h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin: 0; }
.ship-from { margin: -10px 0 0; color: var(--muted); font-size: 15px; }
.ship-row { display: grid; gap: 16px; grid-template-columns: 2fr 1fr; align-items: end; }
@media (max-width: 560px) { .ship-row { grid-template-columns: 1fr; } }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field select {
  width: 100%; font: 700 16px var(--font-body); color: var(--ink); background: var(--bg);
  border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px;
}
.stepper { display: flex; align-items: center; border: 2px solid var(--line); border-radius: 14px; background: var(--bg); overflow: hidden; }
.stepper button { border: 0; background: transparent; width: 48px; height: 48px; font-size: 22px; font-weight: 800; cursor: pointer; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { flex: 1; text-align: center; font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.ship-out { display: grid; gap: 4px; padding: 16px 18px; border-radius: 16px; background: var(--gold-soft); }
.ship-line { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.ship-line b { font-size: 1.05rem; }
.ship-line.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-size: 1.15rem; font-weight: 800; }
.ship-note { margin: 0; font-size: 14px; color: var(--muted); }
.ship-hint { font-size: 14px; color: var(--muted); }
.ship-hint a { color: var(--ink); font-weight: 800; }

footer { border-top: 1px solid var(--line); }
footer .inner { padding-block: 28px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }
.social { display: flex; flex-wrap: wrap; gap: 16px; }
.social a { font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .book, .opt { transition: none; }
  .book:hover, .opt:hover:not(:disabled) { transform: none; }
}
</style>
</head>
<body>

<nav aria-label="Main">
  <div class="inner">
    <a class="logo" href="#top">Quran <span>Animals</span></a>
    <div class="nav-right">
      <div class="links">
        <a href="#books" class="keep" data-t="nav.books"></a>
        <a href="#activity" data-t="nav.activity"></a>
        <a href="#quiz" class="keep" data-t="nav.quiz"></a>
        <a href="#parents" data-t="nav.parents"></a>
        <a href="#gallery" data-t="nav.gallery"></a>
        <a href="#author" data-t="nav.author"></a>
        <a href="#buy" class="keep" data-t="nav.buy"></a>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="inner">
    <div>
      <div class="eyebrow" data-t="hero.eyebrow"></div>
      <h1 data-t="hero.title"></h1>
      <p class="lede" data-t="hero.lede"></p>
      <div class="cta">
        <a class="btn btn-gold" href="#books" data-t="hero.cta1"></a>
        <a class="btn btn-ghost" href="#quiz" data-t="hero.cta2"></a>
      </div>
    </div>
    <div class="hero-art">
      <img src="img/bee.webp" alt="Nur the Bee book cover with a plush bee toy">
      <div class="badge"><span data-t="hero.badge"></span><small data-t="hero.badgeSmall"></small></div>
    </div>
  </div>
</header>

<section class="band" id="books">
  <div class="inner">

/* ===== Rendering ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lang = "en";
const t = k => T[lang][k] ?? T.en[k];
const ref = b => `${t("surah")} ${b.surah[lang]} · ${b.ayah}`;

function renderStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  document.getElementById("names").innerHTML = BOOKS.map(b =>
    `<li><span lang="ar">${b.ar}</span><span>${esc(b.animal[lang])}</span></li>`).join("");

  document.getElementById("shelf").innerHTML = BOOKS.map(b => `
    <button type="button" class="book ${b.id}" data-id="${b.id}" aria-haspopup="dialog">
      <div class="cover"><img src="img/${b.id}.webp" alt="${esc(b.name)}: ${esc(b.lesson.en)}" loading="lazy"></div>
      <div class="info">
        <div class="meta"><span class="num">${t("book")} ${b.n}</span><span class="ar" lang="ar">${b.ar}</span></div>
        <h3>${esc(b.name)}</h3>
        <p class="lesson">${esc(b.lesson[lang])}</p>
        <span class="more">${t("readMore")}</span>
      </div>
    </button>`).join("");

  document.getElementById("values").innerHTML = t("values").map(([h, p]) =>
    `<div class="value"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");

  const gb = document.getElementById("gallery-box");
  if (GALLERY.length) {
    gb.innerHTML = `<div class="gallery">${GALLERY.map(g => {
      const book = BOOKS.find(b => b.id === g.animal);
      const sub = [g.age ? `${g.age} ${t("gallery.age")}` : "", book ? book.animal[lang] : ""].filter(Boolean).join(" · ");
      return `<figure class="art"><img src="${esc(g.img)}" alt="${esc(g.name)}" loading="lazy">
        <figcaption>${esc(g.name)}${sub ? `<small>${esc(sub)}</small>` : ""}</figcaption></figure>`;
    }).join("")}</div>`;
  } else {
    gb.innerHTML = `<div class="frames" aria-hidden="true">
        <div class="frame">نحلة</div><div class="frame">نملة</div><div class="frame">هدهد</div></div>
      <div class="invite"><p><strong>${esc(t("gallery.emptyTitle"))}</strong>${esc(t("gallery.emptyText"))}${
        CONTACT.email ? ` <b>${esc(CONTACT.email)}</b>` : ""}</p></div>`;
  }

  const link = (url, label, cls = "btn btn-gold") => url
    ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`
    : `<span class="soon">${esc(t("soon"))}</span>`;
  document.getElementById("ways").innerHTML = `
    <div class="way"><h3>${esc(t("way.print.h"))}</h3><p>${esc(t("way.print.p"))}</p>${link(SHOP.payhip, t("way.print.btn"))}</div>
    <div class="way"><h3>${esc(t("way.pdf.h"))}</h3><p>${esc(t("way.pdf.p"))}</p><a class="btn btn-ghost" href="#activity">${esc(t("way.pdf.btn"))}</a></div>
    <div class="way quiet"><h3>${esc(t("way.amazon.h"))}</h3><p>${esc(t("way.amazon.p"))}</p>${link(SHOP.amazon, t("way.amazon.btn"), "btn btn-ghost")}</div>`;

  const zoneSel = document.getElementById("ship-zone");
  zoneSel.innerHTML = SHIPPING.zones.map(z => `<option value="${z.id}">${esc(z.name[lang])}</option>`).join("");
  zoneSel.value = ship.zone;
  renderShip();

    ? `<div class="acts">${ACTIVITY.map(a => `
        <article class="act">
          <img src="${esc(a.img)}" alt="${esc(a.title[lang] || a.title.en)}" loading="lazy">
          <div class="act-body">
            <span class="tag">PDF</span>

            <div class="act-foot"><span class="price">${esc(a.price)}</span>${link(a.url, t("act.buy"))}</div>
          </div>
        </article>`).join("")}</div>`
    : `<div class="act-soon">${t("act.ideas").map(([h, p]) =>
        `<div class="act-ghost"><span class="tag">${esc(t("soon"))}</span><strong>${esc(h)}</strong><span>${esc(p)}</span></div>`).join("")}</div>`;

  const social = [
    CONTACT.instagram && `<a href="https://instagram.com/${esc(CONTACT.instagram)}" target="_blank" rel="noopener">Instagram</a>`,

/* ===== Shipping calculator ===== */
const ship = { zone: SHIPPING.zones[0].id, qty: 1 };
const money = n => new Intl.NumberFormat(lang === "en" ? "en-GB" : lang, { style: "currency", currency: "EUR" }).format(n);
const shipCost = (z, q) => (z.freeFrom && q >= z.freeFrom) ? 0 : z.first + z.extra * (q - 1);
const fromPrice = () => Math.min(...SHIPPING.zones.map(z => z.first));

function renderShip() {
  const z = SHIPPING.zones.find(x => x.id === ship.zone) || SHIPPING.zones[0];
  const cost = shipCost(z, ship.qty);
  document.getElementById("ship-qty").textContent = ship.qty;
  document.getElementById("ship-minus").disabled = ship.qty <= 1;
  document.getElementById("ship-plus").disabled = ship.qty >= SHIPPING.maxBooks;
  let html = `<div class="ship-line"><span>${esc(t("ship.cost"))}</span><b>${cost === 0 ? esc(t("ship.free")) : money(cost)}</b></div>
    <div class="ship-line"><span>${esc(t("ship.days"))}</span><b>${esc(z.days)} ${esc(t("ship.daysUnit"))}</b></div>`;
  if (BOOK_PRICE) {
    html += `<div class="ship-line"><span>${esc(t("ship.books"))} (${ship.qty} × ${money(BOOK_PRICE)})</span><b>${money(BOOK_PRICE * ship.qty)}</b></div>
      <div class="ship-line total"><span>${esc(t("ship.total"))}</span><span>${money(BOOK_PRICE * ship.qty + cost)}</span></div>`;
  }
  document.getElementById("ship-out").innerHTML = html;
  const notes = [];
  if (z.freeFrom && ship.qty < z.freeFrom) notes.push(t("ship.freeFrom").replace("{n}", z.freeFrom));
  if (z.id === "uk") notes.push(t("ship.uk"));
  notes.push(t("ship.pdf"));
  document.getElementById("ship-note").textContent = notes.join(" ");
}
document.getElementById("ship-zone").addEventListener("change", e => { ship.zone = e.target.value; renderShip(); });
document.getElementById("ship-minus").addEventListener("click", () => { if (ship.qty > 1) { ship.qty--; renderShip(); } });
document.getElementById("ship-plus").addEventListener("click", () => { if (ship.qty < SHIPPING.maxBooks) { ship.qty++; renderShip(); } });

/* ===== Quiz ===== */
const ROUNDS = 6;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let quiz;

function newQuiz() {
  const order = shuffle(BOOKS);
  quiz = {
    i: 0, score: 0, answered: null, results: [],
    qs: order.slice(0, ROUNDS).map((b, k) => ({
      answer: b.id,
      kind: k % 2 === 0 ? "arabic" : "lesson",
      options: shuffle([b, ...shuffle(BOOKS.filter(x => x.id !== b.id)).slice(0, 3)]).map(x => x.id),
    })),
  };
  renderQuiz();
}

function renderQuiz() {
  const box = document.getElementById("quiz-box");
  const dots = quiz.qs.map((_, k) => {
    const r = quiz.results[k];
    return `<span class="${r === true ? "ok" : r === false ? "no" : k === quiz.i ? "on" : ""}"></span>`;
  }).join("");

  if (quiz.i >= quiz.qs.length) {
    const s = quiz.score, msg = s === ROUNDS ? t("quiz.great") : s >= ROUNDS / 2 ? t("quiz.good") : t("quiz.try");
    box.innerHTML = `<div class="quiz-top"><div class="dots">${dots}</div></div>
      <div class="result"><div>${t("quiz.done")}</div><div class="big">${s} ${t("quiz.of")} ${ROUNDS}</div>
      <p>${esc(msg)}</p><button type="button" class="btn btn-gold" id="q-again">${t("quiz.again")}</button></div>`;
    document.getElementById("q-again").onclick = newQuiz;
    return;
  }

  const q = quiz.qs[quiz.i], right = BOOKS.find(b => b.id === q.answer);
  const prompt = q.kind === "arabic"
    ? `<div class="big-ar" lang="ar">${right.ar}</div><div class="ask">${t("quiz.askArabic")}</div>`
    : `<div class="ask">${t("quiz.askLesson")}</div><div class="big-lesson">“${esc(right.lesson[lang])}”</div>`;
  const opts = q.options.map(id => {
    const b = BOOKS.find(x => x.id === id);
    let cls = "";
    if (quiz.answered) cls = id === q.answer ? "ok" : id === quiz.answered ? "no" : "";
    return `<button type="button" class="opt ${cls}" data-id="${id}" ${quiz.answered ? "disabled" : ""}>
      <img src="img/${id}.webp" alt="">${esc(b.animal[lang])}</button>`;
  }).join("");

  let fb = "", fbCls = "";
  if (quiz.answered) {
    const ok = quiz.answered === q.answer;
    const praise = t("quiz.right");
    fb = ok ? praise[quiz.i % praise.length] : `${t("quiz.wrong")} ${right.animal[lang]}.`;
    fbCls = ok ? "ok" : "no";
  }
  const last = quiz.i === quiz.qs.length - 1;

  box.innerHTML = `<div class="quiz-top"><div class="dots">${dots}</div>
      <span class="score">${quiz.i + 1} / ${ROUNDS}</span></div>
    <div class="q-prompt">${prompt}</div>
    <div class="options">${opts}</div>
    <p class="feedback ${fbCls}">${esc(fb)}</p>
    <div class="quiz-foot">${quiz.answered
      ? `<button type="button" class="btn btn-gold" id="q-next">${last ? t("quiz.finish") : t("quiz.next")}</button>` : ""}</div>`;

  box.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
    quiz.answered = btn.dataset.id;
    const ok = quiz.answered === q.answer;
    quiz.results[quiz.i] = ok;
    if (ok) quiz.score++;
    renderQuiz();
    document.getElementById("q-next")?.focus({ preventScroll: true });
  });
  const next = document.getElementById("q-next");
  if (next) next.onclick = () => { quiz.i++; quiz.answered = null; renderQuiz(); };
}

function setLang(l) {
  lang = T[l] ? l : "en";
  try { localStorage.setItem("qa-lang", lang); } catch (e) {}
  if (dlg.open) dlg.close();
  renderStatic();
  renderQuiz();
}
